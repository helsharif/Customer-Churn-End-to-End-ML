name: churn_ml_env001
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - plotly
  - ipykernel
  - jupyterlab
  - fastapi
  - uvicorn
  - pydantic
  - requests
  - streamlit
  - shap
  - optuna
  - great-expectations
  - pytest
  - ruff
  - python-dotenv
  - joblib
  - pyarrow
  - xgboost
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - tabfm[pytorch]==1.0.0
      - safetensors
      - kaleido>=0.2.1
      - mlflow==3.13.0
