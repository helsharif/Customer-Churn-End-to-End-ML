name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Run tests
        run: pytest

      - name: Validate imports
        run: python -c "import churn_ml; import churn_ml.api.main; import churn_ml.pipelines.training_pipeline"

      - name: Build Docker image
        run: docker build -t churn-api-ci .
