[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-end-to-end-ml"
version = "0.1.0"
description = "End-to-end machine learning workflow for telco customer churn prediction."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Helal Sharif" }
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "plotly",
  "fastapi",
  "uvicorn",
  "pydantic",
  "shap",
  "optuna",
  "great-expectations",
  "python-dotenv",
  "joblib",
  "pyarrow",
  "xgboost",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ipykernel",
  "jupyterlab",
  "kaleido>=0.2.1",
]
gpu = [
  "xgboost-cu13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
