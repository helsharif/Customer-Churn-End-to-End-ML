services:
  api:
    build: .
    command: uvicorn churn_ml.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
    environment:
      - CHURN_MODEL_PATH=/app/artifacts/models/production_model.joblib

  ui:
    build: .
    command: streamlit run src/churn_ml/ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - CHURN_API_BASE_URL=http://api:8000
